<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings</title>
  <link rel="stylesheet" href="ui/box.css" />
</head>

<body>
  <div class="container">
    <header>
      <h1>Settings</h1>
    </header>

    <div class="tabs">
      <div class="tab active" data-tab="course">Course Backup</div>
      <div class="tab" data-tab="additional">Preferences</div>
    </div>

    <div id="course" class="tab-content active">
      <section>
        <h3>Course Backup Settings</h3>
        <label for="concurrency">Concurrent Downloads</label>
        <input type="number" id="concurrency" min="1" max="10" value="5" />

        <label for="quality">Video Quality</label>
        <select id="quality">
          <option value="720p">720p</option>
          <option value="540p">540p</option>
          <option value="360p">360p</option>
        </select>

        <label for="subtitle">Subtitle Language</label>
        <select id="subtitle"></select>
      </section>

      <button id="saveBtn">💾 Save Settings</button>
      <div id="status"></div>
    </div>
    <div id="additional" class="tab-content">
      <section>
        <h3>Discussion Settings</h3>
        <label for="speedInput">Discussion Delay (ms)</label>
        <input type="number" id="speedInput" min="500" max="20000" step="500" value="3000" />
      </section>

      <section style="margin-top: 20px;">
        <h3>Quiz & Automation Settings</h3>
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
          <label for="autoQuizToggle" style="margin: 0; cursor: pointer;">Auto Quiz Attempt on Attempt Page</label>
          <input type="checkbox" id="autoQuizToggle" style="width: 18px; height: 18px; cursor: pointer;" />
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
          <label for="autoSubmitQuizToggle" style="margin: 0; cursor: pointer;">Auto Submit Quiz when Completed</label>
          <input type="checkbox" id="autoSubmitQuizToggle" style="width: 18px; height: 18px; cursor: pointer;" />
        </div>
        <div style="padding: 10px; background: #f1f5f9; border-radius: 8px; font-size: 12px; color: #475569; margin-top: 10px;">
          💡 <strong>Hotkey:</strong> Press <code>Alt + Z</code> (or <code>Ctrl + Shift + Z</code>) on any Coursera quiz to instantly solve and mark answers!
        </div>
      </section>

      <button id="saveAdditionalBtn" style="margin-top: 16px;">💾 Save Preferences</button>
      <div id="additionalStatus"></div>
    </div>
  </div>

  <script src="scripts/box.js"></script>
</body>

</html>
